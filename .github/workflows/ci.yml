name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"

      - name: instaliraj projekat i dev dependencies
        run: pip install -e ".[dev]"

      - name: lint (ruff)
        run: ruff check src/ tests/

      - name: unit testovi
        run: pytest tests/ --cov=src --cov-report=term-missing

      - name: smoke test za komplet pipeline
        run: python -m src.pipeline --config configs/smoke_test.yaml

  build-image:
    needs: lint-and-test
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t uvi_projekat:${{ github.sha }} -f docker/Dockerfile .