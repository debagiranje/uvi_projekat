# baseline config za eksperimente
seed: 42
instance: data/instances/berlin52.tsp

aco:
  n_ants: 15
  n_iterations: 50
  alpha_range: [0.5, 5.0]
  beta_range: [0.5, 5.0]
  rho_range: [0.01, 0.5]
  q_range: [1.0, 500.0]

gp:
  population_size: 15
  n_generations: 15
  crossover_rate: 0.8
  mutation_rate: 0.1
  tournament_size: 3

logging:
  backend: csv
  experiment_name: aco_gp_baseline